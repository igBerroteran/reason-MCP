[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reason-mcp"
version = "0.1.0"
description = "MCP server that controls Reason 13 through the Remote control-surface API"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2", "mido>=1.3", "python-rtmidi>=1.5"]

[project.optional-dependencies]
test = ["pytest", "lupa>=2.0"]

[project.scripts]
reason-mcp = "reason_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reason_mcp = ["catalog.json"]
